version: '3.8'

services:
  neuroquery:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=production
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3